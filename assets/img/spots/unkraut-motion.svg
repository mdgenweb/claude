<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" aria-hidden="true"><style>@media (prefers-reduced-motion:no-preference){.sway{animation:sway 5.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}.s2{animation-duration:6.6s;animation-delay:-2.4s}.s3{animation-duration:4.8s;animation-delay:-3.6s}.float{animation:float 6.5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}}@keyframes sway{from{transform:rotate(-2deg)}to{transform:rotate(2.2deg)}}@keyframes float{from{transform:translate(0,-2px) rotate(-7deg)}to{transform:translate(1px,3px) rotate(9deg)}}</style><g class="sway"><path d="M318 140C314 112 322 88 318 66" fill="none" stroke="#4E7F45" stroke-width="3" stroke-linecap="round"/><circle cx="318" cy="60" r="14" fill="#E2B13C"/><circle cx="318" cy="60" r="14" fill="none" stroke="#C98A3E" stroke-width="2" stroke-dasharray="2 3"/><circle cx="318" cy="60" r="5" fill="#C98A3E"/></g></svg>
