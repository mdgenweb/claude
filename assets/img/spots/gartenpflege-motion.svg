<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" aria-hidden="true"><style>@media (prefers-reduced-motion:no-preference){.sway{animation:sway 5.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}.s2{animation-duration:6.6s;animation-delay:-2.4s}.s3{animation-duration:4.8s;animation-delay:-3.6s}.float{animation:float 6.5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}}@keyframes sway{from{transform:rotate(-2deg)}to{transform:rotate(2.2deg)}}@keyframes float{from{transform:translate(0,-2px) rotate(-7deg)}to{transform:translate(1px,3px) rotate(9deg)}}</style><g class="float"><path d="M430 196C422 194.8 418.6 200.7 421.2 208.1C429.1 208.3 433.6 203.3 430 196Z" fill="#AE542D"/></g><g class="float s2"><path d="M380 150C380.6 157 386.2 158.7 392 155.1C390.6 148.4 385.4 145.5 380 150Z" fill="#C98A3E"/></g></svg>
