<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Pick Your Mech! Playtest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Luckiest+Guy&display=swap">
<style>
/* Layout: full-screen 3D game; HUD on a 1280x720 reference canvas scaled to the screen,
   exactly like the Roblox build (src/client/UI). Single dark game look by design. */
:root {
  color-scheme: dark;
  --ink: #0E1118; --navy-top: #34405A; --navy: #1E2638; --navy-deep: #0F1420;
  --white: #FFFFFF; --muted: #B8C4DA; --gold: #FFD12E; --cyan: #5BE7FF; --good: #6CFF5C;
  --green-t: #8CF55A; --green-b: #2DBE2A; --orange-t: #FFB24A; --orange-b: #FF7417;
  --blue-t: #62CCFF; --blue-b: #1F7BEA; --purple-t: #CF92FF; --purple-b: #8B3FF0;
  --yellow-t: #FFE85E; --yellow-b: #FFB300; --red-t: #FF7070; --red-b: #E02D2D;
  --lime-t: #D4FF5A; --lime-b: #7BD81E; --steel-t: #8A97AD; --steel-b: #535F75;
  --display: "Luckiest Guy", "Arial Black", Impact, sans-serif;
  --body: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --o2: 0 2px 0 var(--ink), 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 -2px 0 var(--ink), 2px 2px 0 var(--ink), -2px 2px 0 var(--ink), 2px -2px 0 var(--ink), -2px -2px 0 var(--ink);
  --o3: 0 3px 0 var(--ink), 3px 0 0 var(--ink), -3px 0 0 var(--ink), 0 -3px 0 var(--ink), 3px 3px 0 var(--ink), -3px 3px 0 var(--ink), 3px -3px 0 var(--ink), -3px -3px 0 var(--ink), 0 6px 0 var(--ink);
  --back: cubic-bezier(.34, 1.56, .64, 1);
}
html, body { height: 100%; margin: 0; overflow: hidden; background: #9fd3ff; overscroll-behavior: none; }
body { font-family: var(--body); color: var(--white); -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
#labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
#hud { position: fixed; inset: 0; pointer-events: none; overflow: hidden;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
#ui { position: absolute; left: env(safe-area-inset-left, 0px); top: env(safe-area-inset-top, 0px); transform-origin: 0 0; }
#ui > * { pointer-events: auto; }
#ui .pass { pointer-events: none; }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 3px solid var(--yellow-t); outline-offset: 3px; }

/* chunky kit (mirrors UIKit.luau) */
.sf { position: relative; border: 3px solid var(--ink); border-radius: 14px; background: linear-gradient(var(--t, var(--navy-top)), var(--b, var(--navy))); box-shadow: 0 5px 0 rgba(14,17,24,.9); }
.sh::before { content: ""; position: absolute; left: 5px; right: 5px; top: 4px; height: 40%; background: rgba(255,255,255,.2); border-radius: 9px; pointer-events: none; }
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: .4em; min-height: 46px; padding: .3em .9em; cursor: pointer;
  font-family: var(--display); font-size: 22px; color: #fff; text-shadow: var(--o2); border: 3px solid var(--ink); border-radius: 12px;
  background: linear-gradient(var(--t, var(--green-t)), var(--b, var(--green-b))); box-shadow: 0 5px 0 rgba(14,17,24,.9); transition: transform .12s var(--back); }
.btn::before { content: ""; position: absolute; left: 5px; right: 5px; top: 4px; height: 40%; background: rgba(255,255,255,.22); border-radius: 8px; pointer-events: none; }
@media (hover: hover) { .btn:hover, .nb:hover { transform: scale(1.07) rotate(-3deg); } }
.btn:active, .nb:active { transform: scale(.92) translateY(3px); }
.btn.off { --t: var(--steel-t); --b: var(--steel-b); }
.btn.shake { animation: shake .25s; }
@keyframes shake { 25% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } 75% { transform: rotate(-3deg); } }
.g { --t: var(--green-t); --b: var(--green-b); } .o { --t: var(--orange-t); --b: var(--orange-b); } .bl { --t: var(--blue-t); --b: var(--blue-b); }
.p { --t: var(--purple-t); --b: var(--purple-b); } .y { --t: var(--yellow-t); --b: var(--yellow-b); } .r { --t: var(--red-t); --b: var(--red-b); }
.l { --t: var(--lime-t); --b: var(--lime-b); } .s { --t: var(--steel-t); --b: var(--steel-b); } .n { --t: var(--navy-top); --b: var(--navy); }
.chip { display: inline-flex; align-items: center; justify-content: center; gap: .3em; padding: 0 .7em; height: 30px; font-family: var(--display); font-size: 17px; text-shadow: var(--o2);
  border: 2.5px solid var(--ink); border-radius: 999px; background: linear-gradient(var(--t, var(--green-t)), var(--b, var(--green-b))); box-shadow: 0 3px 0 rgba(14,17,24,.9); white-space: nowrap; }
.badge { position: absolute; top: -10px; right: -10px; min-width: 28px; height: 28px; padding: 0 4px; display: none; place-items: center; font-family: var(--display); font-size: 15px; text-shadow: var(--o2);
  border: 2.5px solid var(--ink); border-radius: 999px; background: linear-gradient(var(--red-t), var(--red-b)); animation: pulse .5s ease-in-out infinite alternate; z-index: 3; }
.badge.on { display: grid; }
@keyframes pulse { to { transform: scale(1.18); } }
@keyframes bob { to { transform: translateY(-6px); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pop { from { transform: scale(.4); } }

/* HUD */
.abs { position: absolute; }
#top { left: 50%; top: 8px; width: 540px; height: 100px; margin-left: -270px; pointer-events: none; }
#scrapPill { left: 30px; top: 10px; width: 290px; height: 58px; border-radius: 999px; display: flex; align-items: center; padding-left: 62px; }
#coin { left: 0; top: 2px; width: 74px; height: 74px; border-radius: 50%; display: grid; place-items: center; font-size: 40px; z-index: 2; }
#scrap { font-family: var(--display); font-size: 40px; color: var(--gold); text-shadow: var(--o3); padding-top: 7px; line-height: 1; }
#powerPill { left: 340px; top: 14px; width: 196px; height: 50px; border-radius: 999px; display: flex; align-items: center; padding-left: 48px; gap: 10px; }
#bolt { left: 318px; top: 9px; width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center; font-size: 32px; z-index: 2; }
#power { font-family: var(--display); font-size: 32px; color: var(--cyan); text-shadow: var(--o2); padding-top: 5px; }
#multi { left: 100px; top: 72px; display: none; }
#nav { left: 18px; top: 50%; transform: translateY(-50%); display: grid; gap: 24px; }
.nb { position: relative; width: 78px; height: 78px; border-radius: 18px; display: grid; place-items: center; font-size: 42px; cursor: pointer; border: 3px solid var(--ink);
  background: linear-gradient(var(--t), var(--b)); box-shadow: 0 5px 0 rgba(14,17,24,.9); transition: transform .12s var(--back); padding: 0; }
.nb::before { content: ""; position: absolute; left: 5px; right: 5px; top: 4px; height: 40%; background: rgba(255,255,255,.22); border-radius: 12px; pointer-events: none; }
.nb .lbl { position: absolute; left: 50%; bottom: -15px; transform: translateX(-50%); font-family: var(--display); font-size: 19px; text-shadow: var(--o2); white-space: nowrap; }
#right { right: 22px; top: 50%; transform: translateY(-50%); display: grid; gap: 72px; justify-items: center; }
#right .nb { width: 88px; height: 88px; }
#right .chip { position: absolute; left: 50%; bottom: -50px; transform: translateX(-50%); }
#next { left: 50%; bottom: 22px; width: 580px; height: 104px; margin-left: -290px; border-radius: 18px; }
#nextIcon { left: 12px; top: 10px; width: 78px; height: 78px; border-radius: 12px; display: grid; place-items: center; font-size: 46px; }
#nextT1 { left: 104px; top: 8px; font-family: var(--display); font-size: 26px; text-shadow: var(--o2); white-space: nowrap; }
#nextT2 { left: 104px; top: 40px; font-size: 17px; color: var(--muted); font-weight: 600; }
.bar { position: relative; height: 26px; border-radius: 999px; background: var(--navy-deep); border: 2.5px solid var(--ink); overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 999px; background: linear-gradient(var(--t, var(--yellow-t)), var(--b, var(--yellow-b))); transition: width .25s; }
.bar span { position: relative; display: block; text-align: center; font-family: var(--display); font-size: 15px; line-height: 22px; text-shadow: var(--o2); white-space: nowrap; }
#nextBar { position: absolute; left: 104px; top: 66px; width: 290px; }
#upBtn { position: absolute; right: 14px; top: 14px; width: 158px; height: 70px; font-size: 28px; }
#goal { left: 50%; bottom: 140px; transform: translateX(-50%); min-width: 470px; height: 34px; font-size: 18px; }
#hint { left: 50%; bottom: 196px; width: 640px; margin-left: -320px; text-align: center; animation: bob 1.2s ease-in-out infinite alternate; pointer-events: none; }
#hint h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 56px; color: var(--orange-t); text-shadow: var(--o3); transform: rotate(-2deg); }
#hint p { margin: 4px 0 0; font-size: 21px; font-weight: 600; text-shadow: var(--o2); }
#toasts { z-index: 30; left: 50%; top: 118px; width: 420px; margin-left: -210px; display: grid; gap: 10px; justify-items: center; pointer-events: none; }
.toast { width: 400px; min-height: 56px; border-radius: 12px; display: flex; align-items: center; gap: 12px; padding: 6px 12px; animation: pop .3s var(--back); }
.toast .ic { font-size: 36px; }
.toast b { display: block; font-family: var(--display); font-weight: 400; font-size: 23px; text-shadow: var(--o2); line-height: 1.1; }
.toast small { font-size: 16px; font-weight: 600; text-shadow: var(--o2); }
#celebrate { z-index: 30; left: 50%; top: 32%; width: 700px; margin-left: -350px; text-align: center; pointer-events: none; display: none; }
#celebrate.on { display: block; animation: pop .45s var(--back); }
#celebrate .rays { position: absolute; left: 50%; top: 50%; width: 900px; height: 900px; margin: -450px 0 0 -450px; border-radius: 50%;
  background: repeating-conic-gradient(rgba(255,255,255,.18) 0 10deg, transparent 10deg 30deg); animation: spin 14s linear infinite; z-index: -1; }
#celebrate p { margin: 0; font-family: var(--display); font-size: 34px; text-shadow: var(--o3); }
#celebrate h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 96px; line-height: 1.05; transform: rotate(-3deg); color: var(--orange-t); text-shadow: var(--o3); }
#joy { left: 124px; bottom: 26px; width: 150px; height: 150px; border-radius: 50%; background: rgba(14,17,24,.35); border: 3px solid rgba(255,255,255,.35); display: none; touch-action: none; }
#joy i { position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; background: linear-gradient(var(--blue-t), var(--blue-b)); border: 3px solid var(--ink); }
body.touch #joy { display: block; }
#help { right: 18px; bottom: 18px; font-size: 15px; color: #fff; text-shadow: var(--o2); text-align: right; font-weight: 600; pointer-events: none; }
body.touch #help { display: none; }
@media (orientation: portrait) { #joy { bottom: 190px; } }

/* panels */
#backdrop { position: absolute; inset: -50%; background: rgba(0,0,0,.5); display: none; z-index: 19; }
#backdrop.on { display: block; }
.panel { position: absolute; z-index: 20; left: 50%; top: calc(50% + 14px); transform: translate(-50%, -50%); border: 4px solid var(--ink); border-radius: 18px; background: linear-gradient(var(--navy-top), var(--navy));
  box-shadow: 0 7px 0 rgba(14,17,24,.9); display: none; }
.panel.on { display: block; animation: ppop .32s var(--back); }
@keyframes ppop { from { transform: translate(-50%, -50%) scale(.7); } }
.panel .tab { position: absolute; left: 22px; top: -30px; height: 60px; display: flex; align-items: center; gap: 8px; padding: 0 18px 0 12px; font-family: var(--display); font-size: 38px; text-shadow: var(--o3);
  border: 3px solid var(--ink); border-radius: 18px; background: linear-gradient(var(--t), var(--b)); box-shadow: 0 5px 0 rgba(14,17,24,.9); }
.panel .x { position: absolute; right: -18px; top: -20px; width: 56px; height: 56px; padding: 0; font-size: 30px; --t: var(--red-t); --b: var(--red-b); z-index: 2; }
.panel .body { padding: 46px 22px 22px; max-height: calc(var(--uih, 720px) - 96px); overflow-y: auto; box-sizing: border-box; }
.row { display: grid; grid-template-columns: 46px 1fr auto; gap: 12px; align-items: center; padding: 8px 12px; border-radius: 12px; margin-bottom: 10px; }
.row .n { width: 42px; height: 42px; border-radius: 50%; border: 2.5px solid var(--ink); display: grid; place-items: center; font-family: var(--display); font-size: 20px; text-shadow: var(--o2); background: linear-gradient(var(--t), var(--b)); }
.row b { display: block; font-family: var(--display); font-weight: 400; font-size: 22px; text-shadow: var(--o2); }
.row small { font-size: 15px; font-weight: 600; color: var(--muted); }
.row.form small { color: #fff; text-shadow: var(--o2); }
.row .btn { min-width: 140px; }
.cards { display: grid; grid-template-columns: repeat(3, 240px); gap: 18px; }
.card { border-radius: 16px; padding: 12px; display: grid; gap: 6px; justify-items: center; text-align: center; overflow: hidden; }
.card .ico { font-size: 46px; line-height: 1.1; }
.card h4 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 21px; text-shadow: var(--o2); }
.card p { margin: 0; font-size: 14px; font-weight: 600; text-shadow: var(--o2); min-height: 40px; }
.card .btn { width: 100%; }
.featured { display: grid; grid-template-columns: 110px 1fr auto; gap: 16px; align-items: center; padding: 14px 18px; border-radius: 16px; margin-bottom: 20px; overflow: hidden; }
.featured .big { font-size: 64px; text-align: center; }
.featured h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 38px; text-shadow: var(--o3); }
.featured .x2 { font-family: var(--display); font-size: 32px; color: var(--yellow-t); text-shadow: var(--o2); }
.featured p { margin: 0; font-weight: 600; text-shadow: var(--o2); }
.price { --t: #5BD94A; --b: #16872A; }
.note { color: var(--muted); font-size: 14px; margin: 14px 0 0; text-align: center; }
.dots { display: flex; justify-content: space-between; position: relative; margin: 6px 0 18px; }
.dots::before { content: ""; position: absolute; left: 24px; right: 24px; top: 21px; height: 7px; background: var(--ink); }
.dot { position: relative; display: grid; justify-items: center; gap: 4px; width: 70px; }
.dot i { font-style: normal; width: 46px; height: 46px; border-radius: 50%; border: 3px solid var(--ink); display: grid; place-items: center; font-family: var(--display); font-size: 20px; text-shadow: var(--o2); background: linear-gradient(var(--t), var(--b)); }
.dot small { color: var(--muted); font-weight: 600; }
.checks { list-style: none; margin: 0 0 16px; padding: 0; display: grid; gap: 6px; }
.checks li { font-family: var(--display); font-size: 21px; text-shadow: var(--o2); }
.checks li.ok { color: var(--good); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 18px; }
.two .sf { padding: 10px 14px; }
.two h4 { margin: 0 0 4px; font-family: var(--display); font-weight: 400; font-size: 22px; text-shadow: var(--o2); }
.two ul { margin: 0; padding-left: 1.1em; font-weight: 600; text-shadow: var(--o2); }
.center { display: flex; justify-content: center; }
.sect { font-family: var(--display); font-size: 26px; text-shadow: var(--o2); margin: 0 0 10px; }
.tools, .fins { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
.tool, .fin { width: 160px; border-radius: 16px; padding: 10px; display: grid; gap: 6px; justify-items: center; text-align: center; }
.tool .ico { font-size: 44px; }
.tool h4, .fin h4 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 21px; text-shadow: var(--o2); }
.fin p, .tool p { margin: 0; font-size: 13px; color: var(--muted); font-weight: 600; min-height: 34px; }
.fin .sw { display: flex; gap: 6px; }
.fin .sw i { width: 30px; height: 30px; border-radius: 50%; border: 2.5px solid var(--ink); }
.tool .btn, .fin .btn { width: 100%; font-size: 17px; min-height: 40px; }
.daily { display: grid; grid-template-columns: 340px 340px; gap: 20px; }
.daily .sf { padding: 14px 16px; display: grid; gap: 10px; align-content: start; }
.daily h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 26px; text-shadow: var(--o2); text-align: center; }
.daily .big { font-family: var(--display); font-size: 40px; color: var(--gold); text-shadow: var(--o3); text-align: center; }
.daily p { margin: 0; text-align: center; font-weight: 600; }
.stamps { display: flex; gap: 10px; justify-content: center; }
.stamps i { width: 42px; height: 42px; border-radius: 50%; border: 2.5px solid var(--ink); display: grid; place-items: center; font-style: normal; font-family: var(--display); text-shadow: var(--o2); background: linear-gradient(var(--t), var(--b)); }
.picker { display: flex; gap: 22px; }
.pick { width: 250px; border-radius: 18px; padding: 16px; display: grid; gap: 8px; justify-items: center; text-align: center; overflow: hidden; }
.pick .ico { font-size: 96px; line-height: 1.1; }
.pick h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 40px; text-shadow: var(--o3); }
.pick p { margin: 0; font-weight: 600; text-shadow: var(--o2); }
.pick .btn { width: 100%; }

/* world labels (screen space) */
.wl { position: absolute; transform: translate(-50%, -100%); text-align: center; white-space: nowrap; pointer-events: none; }
.wl b { display: block; font-family: var(--display); font-weight: 400; font-size: 22px; color: #FFE14D; text-shadow: var(--o2); }
.wl small { display: block; font-weight: 700; font-size: 14px; text-shadow: var(--o2); }
.wl em { display: block; font-style: normal; font-weight: 700; font-size: 14px; color: var(--good); text-shadow: var(--o2); }
.hp { position: absolute; transform: translate(-50%, -100%); width: 120px; pointer-events: none; text-align: center; }
.hp b { display: block; font-family: var(--display); font-weight: 400; font-size: 14px; text-shadow: var(--o2); white-space: nowrap; }
.hp .bar { height: 18px; } .hp .bar span { font-size: 12px; line-height: 14px; }
.dmg { position: absolute; transform: translate(-50%, -50%); font-family: var(--display); font-size: 30px; text-shadow: var(--o2); pointer-events: none; animation: rise .9s ease-out forwards; }
@keyframes rise { to { transform: translate(-50%, -160%); opacity: 0; } }
.fly { position: absolute; font-size: 28px; pointer-events: none; transition: transform .45s ease-in, opacity .45s; }
.pointer { position: absolute; transform: translate(-50%, -100%); text-align: center; pointer-events: none; animation: bob .6s ease-in-out infinite alternate; }
.pointer b { display: block; font-family: var(--display); font-weight: 400; font-size: 34px; color: var(--orange-t); text-shadow: var(--o3); }
.pointer span { font-family: var(--display); font-size: 40px; color: var(--yellow-t); text-shadow: var(--o2); }
#loading { position: fixed; inset: 0; display: grid; place-items: center; background: linear-gradient(#1E2638, #0F1420); z-index: 50; text-align: center; padding: 0 16px; }
#loading h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(44px, 9vw, 90px); color: var(--orange-t); text-shadow: var(--o3); transform: rotate(-3deg); }
#loading p { font-size: 18px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }
</style>

<canvas id="c" tabindex="0" aria-label="Pick Your Mech game view"></canvas>
<div id="labels" aria-hidden="true"></div>
<div id="hud"><div id="ui">
  <div id="top" class="abs pass">
    <div id="scrapPill" class="abs sf n"><span id="scrap">0</span></div>
    <div id="coin" class="abs sf sh y">⚙️</div>
    <div id="powerPill" class="abs sf n"><span id="power">1</span><span style="color:var(--muted);font-weight:700">POWER</span></div>
    <div id="bolt" class="abs sf sh bl">⚡</div>
    <span id="multi" class="abs chip g">x2 SCRAP</span>
  </div>
  <div id="nav" class="abs">
    <button class="nb g" data-panel="shop" aria-label="Shop">🛒<span class="lbl">SHOP</span><span class="badge" id="bShop">!</span></button>
    <button class="nb o" data-panel="upgrade" aria-label="Upgrades">⚡<span class="lbl">UPGRADE</span><span class="badge" id="bUpgrade">!</span></button>
    <button class="nb p" data-panel="rebirth" aria-label="Rebirth">♻️<span class="lbl">REBIRTH</span><span class="badge" id="bRebirth">!</span></button>
    <button class="nb bl" data-panel="garage" aria-label="Garage">🎨<span class="lbl">GARAGE</span><span class="badge" id="bGarage">NEW</span></button>
    <button class="nb y" data-panel="daily" aria-label="Daily rewards">📋<span class="lbl">DAILY</span><span class="badge" id="bDaily">!</span></button>
  </div>
  <div id="right" class="abs">
    <button class="nb o" id="boostBtn" aria-label="Boost">🚀<span class="lbl">BOOST</span><span class="chip n" id="boostChip">GET</span></button>
    <button class="nb bl" id="autoBtn" aria-label="Auto Farm">🤖<span class="lbl">AUTO</span><span class="chip s" id="autoChip">🔒</span></button>

      else if (id === "Worker") b = btn("CRAFT ⚙️500", "o", () => { if (S.scrap < 500) return errorToast(`Need ${fmt(500 - S.scrap)} more Scrap`); S.scrap -= 500; S.finishes.Worker = true; toast("🎨", "g", "Worker Shell crafted!", "Equip it in the Garage."); refresh(); });
      else if (id === "Lime" || id === "Foundry") b = btn(`GET R$${id === "Lime" ? 9 : 99}`, "bl", () => openPanel("shop"));
      else b = btn(`${Math.min(S.stamps, 5)}/5 📋`, "off", () => {}, "Collect 5 daily stamps to unlock Stamped Chrome");
      el.appendChild(b); fins.appendChild(el);
    }
    let sure = false;
    const reset = btn("RESET PROGRESS", "s", () => { if (!sure) { sure = true; reset.textContent = "TAP AGAIN TO WIPE"; reset.className = "btn r"; return; } S = fresh(); save(); location.reload(); });
    reset.style.fontSize = "16px"; body.querySelector(".center").appendChild(reset);
  },
  daily() {
    body.style.width = "720px";
    rollDaily();
    const p = Math.min(S.daily.progress, DAILY_GOAL), ws = workshopNow();
    const stamps = [1, 2, 3, 4, 5].map((i) => `<i class="${i <= Math.min(S.stamps, 5) ? "y" : "s"}">${i <= Math.min(S.stamps, 5) ? "✓" : ""}</i>`).join("");
    const full = ws >= WORKSHOP_CAP;
    body.innerHTML = `<div class="daily"><div class="sf n"><h3>DAILY CONTRACT</h3><p style="font-family:var(--display);font-size:22px;text-shadow:var(--o2)">Smash ${DAILY_GOAL} junk today</p>
      <div class="bar"><i style="width:${p / DAILY_GOAL * 100}%;--t:${p >= DAILY_GOAL ? "var(--green-t)" : "var(--yellow-t)"};--b:${p >= DAILY_GOAL ? "var(--green-b)" : "var(--yellow-b)"}"></i><span>${p} / ${DAILY_GOAL}</span></div>
      <p>🎁 ${DAILY_REWARD} Scrap + 1 stamp</p><div class="stamps">${stamps}</div><p style="color:var(--muted);font-size:14px">Stamps ${Math.min(S.stamps, 5)}/5 · 5 unlock Stamped Chrome</p><div class="center" id="dC"></div></div>
      <div class="sf n"><h3>WORKSHOP</h3><div class="big">⚙️ ${Math.floor(ws)} / ${WORKSHOP_CAP}</div><p>+${WORKSHOP_RATE} Scrap an hour, even while you're away</p>
      <div class="bar"><i style="width:${ws / WORKSHOP_CAP * 100}%"></i><span></span></div><p style="color:var(--muted);font-size:14px">${full ? "Full! Claim it before it stops filling." : "Full in " + fmtTime((WORKSHOP_CAP - ws) / WORKSHOP_RATE * 3600)}</p><div class="center" id="wC"></div></div></div>`;
    const claimed = S.daily.claimed, ready = p >= DAILY_GOAL;
    $("dC").appendChild(btn(claimed ? "DONE TODAY" : "CLAIM", claimed || !ready ? "off" : "g", () => {
      S.daily.claimed = true; S.stamps += 1; S.scrap += DAILY_REWARD;
      if (S.stamps >= STAMPS_FOR_FINISH && !S.finishes.Chrome) { S.finishes.Chrome = true; toast("🎨", "g", "Stamped Chrome unlocked!", "Equip it in the Garage."); }
      else toast("⚙️", "y", `+${DAILY_REWARD} Scrap`, `Stamp ${Math.min(S.stamps, 5)}/5`);
      refresh();
    }, claimed ? "Already claimed today. New contract tomorrow!" : `Smash ${DAILY_GOAL - p} more junk first`));
    $("wC").appendChild(btn(`CLAIM ${Math.floor(ws)}`, ws >= 1 ? "g" : "off", () => {
      const amt = Math.floor(workshopNow()); S.workshop = { stored: workshopNow() - amt, updated: Date.now() / 1000 }; S.scrap += amt;
      toast("⚙️", "y", `+${amt} Scrap`, "Workshop delivery"); refresh();
    }, "The workshop is still working. Check back soon!"));
  },
  gate() {
    body.style.width = "500px";
    const a = panelArg, d = AREAS[a - 1], gc = gateCheck(a);
    body.innerHTML = `<p class="sect" style="text-align:center;font-size:38px;color:var(--orange-t)">${d.name.toUpperCase()}</p><p style="text-align:center;color:var(--muted);margin:0 0 12px">${d.blurb} · ${fmt(d.hp)} HP · ${d.scrap} Scrap each</p>
      <ul class="checks">${gc.needPrevious ? "<li>❌ Unlock Appliance Row first</li>" : `<li class="${gc.needPower ? "" : "ok"}">${gc.needPower ? "❌" : "✅"} ⚡ Power ${fmt(d.gatePower)} (you: ${fmt(power())})</li><li class="${gc.needScrap ? "" : "ok"}">${gc.needScrap ? "❌" : "✅"} ⚙️ ${fmt(d.gateScrap)} Scrap</li>`}</ul><div class="center"></div>`;
    body.querySelector(".center").appendChild(btn(`UNLOCK · ⚙️ ${fmt(d.gateScrap)}`, gc.ok ? "g" : "off", () => {
      S.scrap -= d.gateScrap; S.gates[a] = true; closePanel(); celebrate(d.name + " unlocked!", `${fmt(d.hp)} HP junk · ${d.scrap} Scrap each`, "var(--blue-t)"); refresh();
    }, "Keep smashing and upgrading to open this gate"));
  },
  picker(again) {
    if (again) return;
    body.style.width = "830px";
    body.innerHTML = `<p style="text-align:center;font-size:20px;font-weight:600;margin:0 0 16px">Choose a free tool. Same damage and reach, so pick the style you like!</p><div class="picker"></div>`;
    const row = body.querySelector(".picker");
    const cols = { Hammer: "o", Saw: "r", Drill: "bl" };
    for (const [id, icon, blurb] of TOOLS) {
      const el = document.createElement("div"); el.className = `pick sf sh ${cols[id]}`;
      el.innerHTML = `<div class="ico">${icon}</div><h3>${id.toUpperCase()}</h3><p>${blurb}</p>`;
      el.appendChild(btn("PICK", "g", () => { S.tool = id; S.toolChosen = true; panelOpen = null; $("panel").classList.remove("on"); $("backdrop").classList.remove("on"); toast("💡", "bl", "Nice pick!", "Walk up to the junk in your lane to smash it."); refresh(); canvas.focus(); }));
      row.appendChild(el);
    }
  },
};
function doUpgrade() {
  const up = nextUp();
  if (!up) return openPanel("rebirth");
  if (S.scrap < up[1]) return errorToast(`Need ${fmt(up[1] - S.scrap)} more Scrap. Keep smashing!`);
  const before = formName(S.level);
  S.scrap -= up[1]; S.level += 1;
  const after = formName(S.level);
  if (after !== before) celebrate(after, "NEW FORM!", "var(--orange-t)");
  else toast("⚡", "o", `Power ${fmt(up[0])}!`, up[2]);
  refresh();
}
function doRebirth() {
  const rc = rebirthCheck(); if (!rc.ok) return;
  S.scrap -= rc.fee; S.rebirths += 1; S.level = 0; S.gates = { 2: false, 3: false }; S.crusher = 0;
  player.x = laneX(1, MY_LANE); player.z = -4; player.heading = 0;
  closePanel(); celebrate(`Rebirth ${S.rebirths}!`, `+${S.rebirths * 25}% Scrap forever`, "var(--purple-t)"); refresh();
}
function buy(key) {
  const o = OFFERS.find((x) => x[0] === key); if (!o) return;
  if (o[1] === "Pass") {
    if (S.passes[key]) return;
    S.passes[key] = true;
    if (key === "LimePaint") S.finishes.Lime = true;
    if (key === "FoundryVIP") S.finishes.Foundry = true;
    if (key === "WorkerStarter") { S.finishes.Worker = true; if (!S.starterGranted) { S.starterGranted = true; S.scrap += 250; } }
  } else if (key === "ScrapBoost") S.boostCharges += 1;
  else if (key === "Scrap600") S.scrap += 600;
  toast("🛒", "g", o[3] + "!", o[4]);
  refresh();
}
$("upBtn").onclick = () => { if (!nextUp()) return openPanel("rebirth"); doUpgrade(); };
$("boostBtn").onclick = () => {
  if (S.boostCharges > 0) { S.boostCharges -= 1; S.boostRemaining += 600; toast("🚀", "o", "2x SCRAP!", "Boost time: " + fmtTime(S.boostRemaining)); refresh(); }
  else openPanel("shop");
};
$("autoBtn").onclick = () => { if (!S.passes.AutoFarm) return openPanel("shop"); autoOn = !autoOn; refresh(); };

// ======================= World labels (pads, gates, HP bars, pointer) =======================
const padEls = PADS.map(([id, x, z, title, sub]) => {
  const el = document.createElement("div"); el.className = "wl"; el.innerHTML = `<b>${title}</b><small>${sub}</small><em></em>`;
  labelLayer.appendChild(el); return { id, pos: new THREE.Vector3(x, 7, z), el };
});
const gateEls = [2, 3].map((a) => {
  const el = document.createElement("div"); el.className = "wl";
  el.innerHTML = `<b style="color:#FF6B6B">🔒 ${AREAS[a - 1].name.toUpperCase()}</b><small>Needs ⚡${AREAS[a - 1].gatePower} Power + ${fmt(AREAS[a - 1].gateScrap)} Scrap</small>`;
  labelLayer.appendChild(el); return { area: a, pos: new THREE.Vector3(gateX(a - 1), 17, CORRIDOR_Z), el };
});
const areaEls = AREAS.map((d, i) => {
  const el = document.createElement("div"); el.className = "wl"; el.innerHTML = `<b style="font-size:30px;color:#FFB24A">${d.name.toUpperCase()}</b><small>${fmt(d.hp)} HP · ${d.scrap} Scrap each</small>`;
  labelLayer.appendChild(el); return { pos: new THREE.Vector3(areaX0(i + 1) + 26, 19, -2), el };
});
const pointerEl = document.createElement("div"); pointerEl.className = "pointer"; pointerEl.innerHTML = "<b>SMASH!</b><span>▼</span>"; labelLayer.appendChild(pointerEl);
function padLive(id) {
  if (id === "upgrade") { const u = nextUp(); return u ? `Next: ⚡${fmt(u[0])} for ${fmt(u[1])} Scrap` : "MAX POWER!"; }
  if (id === "daily") return `Workshop ${Math.floor(workshopNow())}/${WORKSHOP_CAP} · Contract ${Math.min(S.daily.progress, DAILY_GOAL)}/${DAILY_GOAL}`;
  if (id === "rebirth") return S.rebirths >= 5 ? "All rebirths done!" : `Scrap x${rebirthFactor(S.rebirths).toFixed(2)} → x${rebirthFactor(S.rebirths + 1).toFixed(2)}`;
  if (id === "shop") return S.boostCharges > 0 ? `${S.boostCharges} boost charge${S.boostCharges === 1 ? "" : "s"} ready` : "7 offers";
  return `${Object.values(S.finishes).filter(Boolean).length}/5 finishes`;
}
function place(el, pos, maxDist) {
  const d = camera.position.distanceTo(pos);
  const s = toScreen(pos);
  if (!s.on || d > maxDist) { el.style.display = "none"; return false; }
  el.style.display = ""; el.style.left = s.x + "px"; el.style.top = s.y + "px";
  const k = Math.max(0.55, Math.min(1.1, 60 / d)); el.style.transform = `translate(-50%, -100%) scale(${k})`;
  return true;
}
function updateLabels() {
  for (const p of padEls) { if (place(p.el, p.pos, 160)) p.el.querySelector("em").textContent = padLive(p.id); }
  for (const g of gateEls) { if (unlocked(g.area)) g.el.style.display = "none"; else place(g.el, g.pos, 260); }
  for (const a of areaEls) place(a.el, a.pos, 320);
  for (const t of targets) {
    const pos = new THREE.Vector3((t.box[0] + t.box[2]) / 2, t.height + 1.6, (t.box[1] + t.box[3]) / 2);
    const near = t === hitTarget || pos.distanceTo(player.group.position) < 26 + 6 * BODY_SCALE[S.level];
    if (!near) { if (t.el) t.el.style.display = "none"; continue; }
    if (!t.el) { t.el = document.createElement("div"); t.el.className = "hp"; t.el.innerHTML = `<b></b><div class="bar"><i></i><span></span></div>`; labelLayer.appendChild(t.el); }
    if (!place(t.el, pos, 80)) continue;
    const locked = !unlocked(t.area), r = t.hp / t.max;
    t.el.querySelector("b").textContent = `${t.name}  ⚙️${AREAS[t.area - 1].scrap}`;
    const fill = t.el.querySelector("i"); fill.style.width = r * 100 + "%";
    const col = locked ? "steel" : r > 0.5 ? "green" : r > 0.25 ? "yellow" : "red";
    fill.style.setProperty("--t", `var(--${col}-t)`); fill.style.setProperty("--b", `var(--${col}-b)`);
    t.el.querySelector("span").textContent = (locked ? "🔒 " : "") + fmt(Math.max(t.hp, 0)) + " HP";
  }
  if (S.destroys === 0 && S.toolChosen) {
    let best = null, bd = Infinity;
    for (const t of targets) if (t.area === 1) { const d = Math.hypot((t.box[0] + t.box[2]) / 2 - player.x, (t.box[1] + t.box[3]) / 2 - player.z); if (d < bd) { bd = d; best = t; } }
    if (best) { place(pointerEl, new THREE.Vector3((best.box[0] + best.box[2]) / 2, best.height + 6, (best.box[1] + best.box[3]) / 2), 200); pointerEl.style.transform = "translate(-50%, -100%)"; }
  } else pointerEl.style.display = "none";
}
let gatePrompted = 0;
function checkPadsAndGates() {
  let inside = null;
  for (const [id, x, z] of PADS) if (Math.hypot(x - player.x, z - player.z) <= 6) inside = id;
  if (inside && !panelOpen && openedByPad !== inside) { openPanel(inside); openedByPad = inside; }
  else if (!inside && openedByPad) { if (panelOpen === openedByPad) closePanel(); openedByPad = null; }
  for (let a = 2; a <= 3; a++) {
    if (unlocked(a)) continue;
    const d = Math.hypot(gateX(a - 1) - player.x, CORRIDOR_Z - player.z);
    if (d < 12 && gatePrompted !== a && !panelOpen) { gatePrompted = a; openPanel("gate", a); }
    else if (d > 20 && gatePrompted === a) gatePrompted = 0;
  }
}

// ======================= Main loop =======================
let last = performance.now(), tick = 0, labelTick = 0, slowTick = 0;
function frame(now) {
  // Fixed small steps keep collision solid and game speed real-time even when frames are slow.
  let remaining = Math.min(0.25, (now - last) / 1000); last = now;
  const dt = remaining;
  while (remaining > 1e-4) {
    const step = Math.min(0.05, remaining); remaining -= step; clock += step;
    updatePlayer(step);
    tick += step; if (tick >= 0.1) { tick = 0; combatStep(); }
  }
  for (const t of targets) {
    if (t.spawnT < 1) { t.spawnT = Math.min(1, t.spawnT + dt * 4); const k = t.spawnT; t.group.scale.setScalar(0.2 + 0.8 * (1 + 2.70158 * Math.pow(k - 1, 3) + 1.70158 * Math.pow(k - 1, 2))); }
    if (t.shake > 0) { t.shake -= dt; t.group.position.set(t.base.x + (Math.random() - 0.5) * 0.4, 0, t.base.z + (Math.random() - 0.5) * 0.4); if (t.shake <= 0) t.group.position.copy(t.base); }
  }
  for (const g of [2, 3]) if (gateMeshes[g]) gateMeshes[g].visible = !unlocked(g);
  updateDebris(dt);
  // camera follows behind the mech
  const sc = BODY_SCALE[S.level], focus = new THREE.Vector3(player.x, 3.2 * sc, player.z);
  const d = camDist * (0.85 + sc * 0.15);
  camera.position.set(focus.x + Math.sin(camYaw) * Math.cos(camPitch) * d, focus.y + Math.sin(camPitch) * d, focus.z + Math.cos(camYaw) * Math.cos(camPitch) * d);
  camera.lookAt(focus);
  if (camShake > 0) { camShake -= dt; camera.rotateX((Math.random() - 0.5) * camShake * 0.1); camera.rotateY((Math.random() - 0.5) * camShake * 0.1); }
  sun.position.set(player.x + 60, 120, player.z + 50); sun.target.position.set(player.x, 0, player.z);
  renderer.render(scene, camera);
  labelTick += dt; if (labelTick > 0.033) { labelTick = 0; updateLabels(); }
  slowTick += dt; if (slowTick > 0.25) { slowTick = 0; checkPadsAndGates(); updateBoostChip(); if (panelOpen === "daily") RENDER.daily(true); }
  requestAnimationFrame(frame);
}

// ======================= Boot =======================
fetch("game.json").then((r) => r.json()).then((d) => {
  DATA = d; COLORS = d.colors.map((h) => new THREE.Color("#" + h));
  buildWorld();
  for (let a = 1; a <= 3; a++) for (let s = 0; s < SLOTS[a - 1].length; s++) spawnTarget(a, s);
  for (const t of targets) { t.spawnT = 1; t.group.scale.setScalar(1); }
  rebuildMech(); fitUI(); refresh();
  $("loading").remove();
  if (!S.toolChosen) openPanel("picker");
  canvas.focus();
  requestAnimationFrame((t) => { last = t; frame(t); });
}).catch((e) => { $("loadMsg").textContent = "Couldn't load the game data. Reload to try again."; console.error(e); });
window.__pym = { S: () => S, player, targets, openPanel };
})();
</script>
